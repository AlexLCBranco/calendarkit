# Tests on every push and pull request: unit tests (incl. both time zones), typecheck + build, Playwright smoke.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # e2e ~9-12 min since round 6 (the perf scroll checks also run the reference build)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # check-version compares HEAD with its parent
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-version
        if: github.event_name == 'push'
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
