# Tests on every push and pull request. Round 8 (0.2): three kinds of job run side by side, so a push waits for the
# slowest one instead of the sum — unit (version check, unit tests in both zones, typecheck + build), the functional
# e2e in 5 jobs (round 14: desktop-xl and desktop halved by test, tablet + phone), and the perf guard on a runner of its own (nothing else
# runs on its machine, as before when it ran after the other projects). Every job runs on every push; nothing moved to nightly.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # check-version compares HEAD with its parent
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-version
        if: github.event_name == 'push'
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # round 14 (item 2): the groups of scripts/e2e-all.ts (GROUPS), one job each — desktop-xl and desktop halved by test
        # (fullyParallel in playwright.config.ts), tablet + phone together; was one job for desktop-xl and one for the
        # rest (6.5 / 5.4 min)
        projects: ['--project=desktop-xl --shard=1/2', '--project=desktop-xl --shard=2/2', '--project=desktop --shard=1/2', '--project=desktop --shard=2/2', '--project=tablet --project=phone']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ strategy.job-index }}
          path: e2e/screenshots/
          if-no-files-found: ignore

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5 # scripts/perf-ref.ts fetches the reference commit itself
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=perf --no-deps

  # Round 10: the live site at its new address (gauntlet-home.vercel.app/calendar/, through the gauntlet's rewrite) once
  # Vercel has deployed this push: the old address's redirect and notes hand-off, the gauntlet page's access to the data
  # and notes, the smoke test and the version file. Pushes to main only (that's what deploys).
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/wait-live.ts ${{ github.sha }}
      - run: npx playwright test --project=desktop-xl e2e/move.spec.ts e2e/smoke.spec.ts e2e/version.spec.ts
        env:
          E2E_BASE_URL: https://gauntlet-home.vercel.app
          E2E_LIVE: '1'
      # v1.40.0: the live data is no more than 1 day behind the latest snapshot (scripts/check-live-data.ts)
      - run: npx tsx scripts/check-live-data.ts
